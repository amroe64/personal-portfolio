		<title>Portfolio Website - Amr Elamin</title>
  <style>
    /* Reset and base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    /* Hidden portfolio content */
    .portfolio {
      display: none;
    }
    /* Overlay styles */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #660000, #FF6600);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 9999;
      animation: fadeIn 1s ease-in-out;
      padding: 20px;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .overlay h1 {
			color: #fff;
      font-size: 3em;
      margin-bottom: 20px;
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-30px); }
      60% { transform: translateY(-15px); }
    }
    .overlay p {
      font-size: 1.2em;
      max-width: 600px;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .overlay span {
      font-size: 0.9em;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <!-- Coming Soon Overlay -->
  <div class="overlay">
    <h1>Hey There!</h1><br>
    <p>
      I'm busy cooking up something behind the scenes right now. <br>
    <span>Thanks for your patience—swing by in a little bit!</span>
  </div>

  <!-- Portfolio content (hidden until ready) -->
  <div class="portfolio">
    <h1>Welcome to My Portfolio</h1>
    <!-- More content goes here -->
  </div>
</body>
</html>
